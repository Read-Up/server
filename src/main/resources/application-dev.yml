spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER_NAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        ddl-auto: validate
        default_schema: "dev"
        default_batch_fetch_size: 500
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/seed

book-info-client:
  default-service-name: "Aladin"
  national-library:
    url: "https://www.nl.go.kr/seoji"
    cert-key: ${NATIONAL_LIBRARY_API_KEY}
    service-name: "NationalLibraryOfKorea"
  aladin:
    url: "http://www.aladin.co.kr/ttb/api"
    service-name: "Aladin"
    ttb-key: ${ALADIN_API_KEY}

gemini-client:
  api-key: ${GEMINI_API_KEY}
  parse-chapter-prompt-template: |
    HTML 형식의 목차 텍스트에서 1차 챕터 제목을 찾아, 답변은 json 형식으로 변환해줘. order는 순서, name은 챕터 제목이야.

    [
      {
        "chapterOrder": 1,
        "name": "1장 오브젝트와 의존관계"
      },
      {
        "chapterOrder": 2,
        "name": "2장 테스트"
      },
      ...
    ]

redirect:
  base-uri: "http://localhost:3001"
  sign-up-uri: "/signup"
  sign-in-fail-uri: "/signin?error=true"

server:
  forward-headers-strategy: framework

cloud:
  r2:
    endpoint: https://336149032d9ef422f450e812b9312045.r2.cloudflarestorage.com
    bucket: read-up-user
    cdn-domain: https://cdn.read-up.kr